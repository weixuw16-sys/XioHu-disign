<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff7fb">
    <meta name="description" content="为两个人打开专属的小小宇宙。">
    <title>开启我们的小小宇宙</title>
    <link rel="manifest" href="./love-app.webmanifest">
    <link rel="icon" href="./icons/love-app-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/love.css">
</head>
<body class="love-page setup-page">
    <canvas class="particle-layer" id="particleLayer" aria-hidden="true"></canvas>
    <header class="love-nav">
        <a class="love-brand" href="./setup.html">
            <span class="brand-heart" aria-hidden="true">♥</span>
            <span>我们的小小宇宙</span>
        </a>
    </header>

    <main class="setup-main">
        <section class="setup-heading">
            <p class="eyebrow">A SPACE JUST FOR TWO</p>
            <h1>让你们的<span>小小宇宙</span><br>从这里开始</h1>
            <p>选好你的身份，就能把这份心意送到对方手机上。</p>
        </section>

        <div class="role-switch" role="group" aria-label="选择你的身份">
            <button class="role-option active" type="button" data-role-choice="boy" aria-pressed="true">
                <span aria-hidden="true">♡</span> 我是男生
            </button>
            <button class="role-option" type="button" data-role-choice="girl" aria-pressed="false">
                <span aria-hidden="true">✿</span> 我是女生
            </button>
        </div>

        <section class="setup-panel" id="boySetupPanel" aria-labelledby="boy-setup-title">
            <h2 id="boy-setup-title">准备一份专属表白</h2>
            <p>写下想对她说的话，App 会生成一次性配对码。</p>
            <form id="boySetupForm">
                <label for="boyName">你的昵称</label>
                <input id="boyName" name="name" maxlength="30" placeholder="她平时怎么叫你？" required>
                <label for="boyConfession">想对她说的话</label>
                <textarea id="boyConfession" name="confession" rows="5" maxlength="1000" placeholder="把一直想说的心意，认真写给她……" required></textarea>
                <button class="primary-link setup-submit" type="submit">生成表白配对码 <span aria-hidden="true">♡</span></button>
            </form>
        </section>

        <section class="setup-panel" id="girlSetupPanel" aria-labelledby="girl-setup-title" hidden>
            <h2 id="girl-setup-title">接收他准备的表白</h2>
            <p>输入他分享给你的配对码，就能打开专属情书。</p>
            <form id="girlSetupForm">
                <label for="girlName">你的昵称</label>
                <input id="girlName" name="name" maxlength="30" placeholder="你喜欢别人怎么叫你？" required>
                <label for="inviteCode">10 位配对码</label>
                <input id="inviteCode" name="code" class="invite-code-input" maxlength="10" minlength="10" autocomplete="one-time-code" autocapitalize="characters" placeholder="例如：AB23CD45EF" required>
                <button class="primary-link setup-submit" type="submit">收下他的表白 <span aria-hidden="true">♥</span></button>
            </form>
        </section>
        <p class="setup-status" id="setupStatus" role="status" aria-live="polite">写好想说的话，生成配对码后分享给她。</p>
        <p class="setup-footnote">配对与收取表白需要联网；唤醒消息会保存在你们的专属空间里。</p>
    </main>
    <script src="./js/love.js"></script>
</body>
</html>
