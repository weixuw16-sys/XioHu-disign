name: Deploy portfolio manager backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-portfolio-manager-backend.yml"
      - "supabase/functions/_shared/manager.ts"
      - "supabase/functions/github-auth/**"
      - "supabase/functions/github-manager/**"
      - "supabase/functions/couple-sync/**"
      - "supabase/config.toml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Check required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret." && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "::error::Add the SUPABASE_PROJECT_REF repository secret." && exit 1)

      - name: Deploy GitHub OAuth function
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy github-auth --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy portfolio manager function
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy github-manager --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy couple connection function
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy couple-sync --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
